name: Test FireSight
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[test]'
      - run: FIRESIGHT_DETECTOR=opencv python -m unittest discover -s tests
      - run: python -m build
      - run: npm ci
        working-directory: glasses-app
      - run: node --test glasses-app/tests/display.test.mjs
      - run: npm run build
        working-directory: glasses-app
      - run: node --check src/firesight/dashboard/app.js
