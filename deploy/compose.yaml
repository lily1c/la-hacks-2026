services:
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8787"
    environment:
      INGEST_MODE: push
      INGEST_TOKEN: ${INGEST_TOKEN:?Set a private ingest token}
      PUBLIC_DEPLOYMENT: "true"
      G2_REPORT_TOKEN: ${G2_REPORT_TOKEN:-}
      FIRESIGHT_DETECTOR: ${FIRESIGHT_DETECTOR:-opencv}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    logging:
      options:
        max-size: "5m"
        max-file: "2"
