[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firesight"
version = "0.1.0"
description = "Gemini vision wildfire frame analyzer with OpenCV fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python",
  "numpy",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "google-genai>=1.0.0",
]

[project.scripts]
firesight-analyze = "firesight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firesight = ["dashboard/*.html", "dashboard/media/*.mp4"]
