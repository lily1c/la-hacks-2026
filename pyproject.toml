[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firesight"
version = "0.1.0"
description = "OpenCV drone-video fire alert service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python",
  "numpy",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[project.scripts]
firesight-analyze = "firesight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
