<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireSight · Analysis test</title><style>body{background:#edf2e9;color:#253d31;font:16px system-ui;margin:auto;padding:24px;max-width:720px}input,button{font:inherit;padding:12px;margin:8px 0}button{background:#325d47;color:white;border:0;border-radius:8px}img{max-width:100%;max-height:350px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px}label{display:block}</style>
<a href="/">Dashboard</a><h1>Image analysis test</h1><p>Analyze one image without publishing its result to the glasses. GPS is not needed for image understanding.</p><pre id="config">Checking detector…</pre><label>Ingest token <input type="password" id="token" autocomplete="off"></label><label>Choose a photo <input type="file" id="file" accept="image/jpeg,image/png"></label><button id="latest">Use latest phone frame</button><br><img id="preview" alt="Selected test frame" hidden><br><button id="run" disabled>Analyze image</button><pre id="result" role="status">Choose a photo or the latest phone frame.</pre>
<script>
const $=id=>document.getElementById(id);let image=null,url=null;
function select(blob){image=blob;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('preview').src=url;$('preview').hidden=false;$('run').disabled=false;}
fetch('/analysis/status').then(r=>r.json()).then(c=>{$('config').textContent=`Detector: ${c.detector}${c.detector==='gemini'?' · '+c.model:' (color heuristic, not a vision-language model)'}\nGemini key configured: ${c.gemini_key_configured}\nGlasses delivery: ${c.glasses_delivery_enabled?'enabled':'paused'}`;}).catch(()=>{$('config').textContent='Could not read detector configuration';});
$('file').onchange=()=>{if($('file').files[0])select($('file').files[0]);};
$('latest').onclick=async()=>{try{const r=await fetch('/live');const d=await r.json();if(!d.fresh||!d.snapshot?.image)throw Error('No fresh phone frame. Start /phone first, or choose a saved image.');select(await (await fetch(d.snapshot.image)).blob());$('result').textContent='Selected frame '+d.snapshot.frame_id;}catch(e){$('result').textContent=e.message;}};
$('run').onclick=async()=>{if(!image)return;if(!$('token').value.trim()){$('result').textContent='Enter the ingest token.';return;}$('run').disabled=true;$('result').textContent='Analyzing…';try{const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':image.type,Authorization:'Bearer '+$('token').value.trim()},body:image,signal:AbortSignal.timeout(60000)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d));$('result').textContent=JSON.stringify(d,null,2);}catch(e){$('result').textContent=e.message;}finally{$('run').disabled=false;}};
</script></html>
